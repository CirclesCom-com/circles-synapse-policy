name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Unit tests
        run: python3 -m unittest discover -s tests -t . -v
      - name: Builds as a package
        run: python3 -m pip wheel --no-deps --wheel-dir dist .
